name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: 2026.11.3
      - run: mise run test
      - name: Check dist/mise.toml is up to date
        run: |
          mise run build
          git diff --exit-code dist/mise.toml
      - run: mise run package "$GITHUB_REF_NAME"
      - name: Push OCI artifact
        id: oci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR requires a lowercase repository name.
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GITHUB_TOKEN"
          cd dist
          digest=$(oras push --format 'go-template={{.digest}}' \
            --artifact-type application/vnd.mise.registry.v1 \
            --annotation "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "org.opencontainers.image.created=$(git log -1 --format=%cI "$GITHUB_SHA")" \
            "$image:$GITHUB_REF_NAME" mise.toml:application/toml)
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.oci.outputs.image }}
          DIGEST: ${{ steps.oci.outputs.digest }}
        run: |
          cat > notes.md <<EOF2
          OCI artifact: \`$IMAGE:$GITHUB_REF_NAME\`

          Pin by digest:

          \`\`\`toml
          include = ["oci::$IMAGE@$DIGEST"]
          \`\`\`

          \`registry-$GITHUB_REF_NAME.zip\` holds the same \`mise.toml\`.
          EOF2
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "release/registry-$GITHUB_REF_NAME.zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "release/registry-$GITHUB_REF_NAME.zip" \
              --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
