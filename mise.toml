include = ["dist/mise.toml"]

[settings]
python.uv_venv_auto = "source"

[tools]
"airgap:uv" = "0.13.7"
"airgap:age" = "1.2.1"
"airgap:oras" = "1.3.6"

[tasks.build]
description = "Generate dist/mise.toml from tools/*.toml and mirror.toml"
run = "uv run scripts/build.py tools dist/mise.toml mirror.toml"

[tasks.test]
description = "Run tests"
run = "uv run python -m unittest discover tests"

[tasks.urls]
description = "Print internet URLs to mirror for a tool version (default: test_version), e.g. mise run urls jq 1.8.2"
run = "uv run scripts/urls.py"

[tasks.validate]
description = "Install a tool's test_version in a sandbox and run its test_command, e.g. mise run validate jq"
run = "uv run scripts/validate.py"

[tasks.package]
description = "Write release/registry-<tag>.zip from dist/mise.toml, e.g. mise run package v1.0.0"
run = "uv run scripts/package.py"
